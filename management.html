
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פאנל ניהול - OLIVES JEWELRY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #FDFBF7;
        }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .bg-deep-black { background-color: #1A1A1A; }
        .text-gold { color: #D4AF37; }
    </style>
</head>
<body class="bg-cream text-gray-800">

    <div id="auth-overlay" class="fixed inset-0 bg-gray-900/80 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl text-center">
            <h2 class="text-2xl font-serif mb-4">כניסת מנהל מערכת</h2>
            <input type="password" id="password" placeholder="הזן סיסמה" class="w-full px-4 py-2 border rounded-md mb-4 text-center">
            <button id="login-btn" class="bg-deep-black text-white px-8 py-2 rounded-md hover:opacity-90">כניסה</button>
        </div>
    </div>

    <main id="admin-panel" class="container mx-auto p-8 hidden">
        <h1 class="text-4xl font-serif text-center mb-12">ניהול מוצרים</h1>

        <!-- Add Product Form -->
        <div class="bg-white p-8 rounded-lg shadow-md mb-12">
            <h2 class="text-2xl font-serif mb-6">הוספת מוצר חדש</h2>
            <form id="addProductForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="text" id="productName" placeholder="שם המוצר" class="px-4 py-2 border rounded-md" required>
                <input type="text" id="productCategory" placeholder="קטגוריה" class="px-4 py-2 border rounded-md" required>
                <input type="number" id="productPrice" placeholder="מחיר (בשקלים)" class="px-4 py-2 border rounded-md" required>
                <input type="text" id="productImageUrl" placeholder="כתובת URL של תמונה" class="px-4 py-2 border rounded-md" required>
                <div class="md:col-span-2 text-left">
                    <button type="submit" class="bg-deep-black text-white px-8 py-3 rounded-md hover:opacity-90">הוסף מוצר</button>
                </div>
            </form>
        </div>

        <!-- Products Table -->
        <div>
            <h2 class="text-2xl font-serif mb-6">רשימת מוצרים</h2>
            <div class="overflow-x-auto bg-white rounded-lg shadow-md">
                <table class="w-full text-right">
                    <thead class="border-b-2 border-gray-200">
                        <tr>
                            <th class="p-4">תמונה</th>
                            <th class="p-4">שם</th>
                            <th class="p-4">קטגוריה</th>
                            <th class="p-4">מחיר</th>
                            <th class="p-4">פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <!-- Products will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const correctPassword = "admin"; // Using a simple password for this static site.

        const authOverlay = document.getElementById('auth-overlay');
        const adminPanel = document.getElementById('admin-panel');
        const loginBtn = document.getElementById('login-btn');
        const passwordInput = document.getElementById('password');
        
        loginBtn.addEventListener('click', () => {
            if (passwordInput.value === correctPassword) {
                authOverlay.style.display = 'none';
                adminPanel.classList.remove('hidden');
                loadProducts();
            } else {
                alert('סיסמה שגויה');
            }
        });

        const productsTableBody = document.getElementById('productsTableBody');
        const addProductForm = document.getElementById('addProductForm');

        async function loadProducts() {
            try {
                const response = await fetch('products.json');
                const products = await response.json();
                renderProducts(products);
            } catch (error) {
                console.error('Error loading products:', error);
                alert('שגיאה בטעינת המוצרים.');
            }
        }

        function renderProducts(products) {
            productsTableBody.innerHTML = '';
            products.forEach(product => {
                const row = document.createElement('tr');
                row.className = 'border-b hover:bg-gray-50';
                row.innerHTML = `
                    <td class="p-4"><img src="${product.imageUrl}" alt="${product.name}" class="w-16 h-20 object-cover rounded-sm"></td>
                    <td class="p-4 font-semibold">${product.name}</td>
                    <td class="p-4 text-gray-600">${product.category}</td>
                    <td class="p-4 font-semibold">₪${product.price}</td>
                    <td class="p-4">
                        <button onclick="deleteProduct('${product.id}')" class="text-red-600 hover:text-red-800">מחק</button>
                    </td>
                `;
                productsTableBody.appendChild(row);
            });
        }

        addProductForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newProduct = {
                id: 'p' + Date.now(), // Simple unique ID
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                price: parseInt(document.getElementById('productPrice').value),
                imageUrl: document.getElementById('productImageUrl').value,
            };

            // This is a simulation. In a real backend, you'd send this to the server.
            alert(`הנחיה ל-Gemini: \n1. קרא את הקובץ products.json. \n2. הוסף את האובייקט החדש למערך המוצרים: \n${JSON.stringify(newProduct, null, 2)}\n3. שמור את הקובץ products.json המעודכן.\n4. טען מחדש את המוצרים בפאנל הניהול.`);

            addProductForm.reset();
        });

        window.deleteProduct = async (productId) => {
            if (confirm('האם אתה בטוח שברצונך למחוק מוצר זה?')) {
                 // This is a simulation. In a real backend, you'd send this to the server.
                alert(`הנחיה ל-Gemini: \n1. קרא את הקובץ products.json. \n2. הסר את המוצר עם ה-ID הבא: ${productId}\n3. שמור את הקובץ products.json המעודכן.\n4. טען מחדש את המוצרים בפאנל הניהול.`);
            }
        }
    });
</script>

</body>
</html>
