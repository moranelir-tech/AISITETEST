
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olives Jewelry Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-cream">
    <style>
        :root {
            --gold: #D4AF37;
            --cream: #F5F5DC;
            --black: #000000;
        }
        .bg-gold { background-color: var(--gold); }
        .bg-cream { background-color: var(--cream); }
        .text-gold { color: var(--gold); }
    </style>

    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-gray-800">Olives Jewelry</a>
            <div>
                <a href="shop.html" class="mx-2 text-gray-600 hover:text-gold">Shop</a>
                <a href="#" class="mx-2 text-gray-600 hover:text-gold">About</a>
                <a href="#" class="mx-2 text-gray-600 hover:text-gold">Contact</a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="bg-cover bg-center h-screen" style="background-image: url('https://images.unsplash.com/photo-1588444968576-f84966d234d3?q=80&w=2070&auto=format&fit=crop');">
        <div class="flex items-center justify-center h-full bg-black bg-opacity-50">
            <div class="text-center">
                <h1 class="text-white text-5xl font-bold">Timeless Elegance</h1>
                <p class="text-white text-xl mt-4">Discover jewelry that tells your story.</p>
                <a href="shop.html" class="mt-8 inline-block bg-gold text-white text-lg font-semibold px-8 py-3 rounded-md hover:bg-yellow-600">Shop Now</a>
            </div>
        </div>
    </section>

    <!-- Featured Collections -->
    <section class="py-20">
        <div class="container mx-auto px-6">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-10">Featured Collections</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="text-center">
                    <a href="shop.html">
                        <img src="https://images.unsplash.com/photo-1611652032952-a8c6778431d4?q=80&w=2070&auto=format&fit=crop" alt="Necklaces" class="w-full h-64 object-cover rounded-md shadow-lg">
                        <h3 class="text-xl font-semibold text-gray-800 mt-4">Necklaces</h3>
                    </a>
                </div>
                <div class="text-center">
                    <a href="shop.html">
                        <img src="https://images.unsplash.com/photo-1598564996227-242d5448b3df?q=80&w=2070&auto=format&fit=crop" alt="Rings" class="w-full h-64 object-cover rounded-md shadow-lg">
                        <h3 class="text-xl font-semibold text-gray-800 mt-4">Rings</h3>
                    </a>
                </div>
                <div class="text-center">
                    <a href="shop.html">
                        <img src="https://images.unsplash.com/photo-1611591437281-462bf4d26afa?q=80&w=2070&auto=format&fit=crop" alt="Bracelets" class="w-full h-64 object-cover rounded-md shadow-lg">
                        <h3 class="text-xl font-semibold text-gray-800 mt-4">Bracelets</h3>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/972500000000" target="_blank" class="fixed bottom-8 right-8 bg-green-500 text-white p-4 rounded-full shadow-lg hover:bg-green-600">
        <i class="fab fa-whatsapp fa-2x"></i>
    </a>

</body>
</html>
