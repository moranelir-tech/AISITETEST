<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פרטי מוצר - Olives Jewelry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #FDFBF7;
        }
        :root {
            --brand-green: #575A3A;
            --brand-light: #FDFBF7;
            --brand-dark: #2C2D1D;
        }
        .bg-brand-green { background-color: var(--brand-green); }
        .text-brand-green { color: var(--brand-green); }
        .border-brand-green { border-color: var(--brand-green); }
        .hover\:bg-brand-dark:hover { background-color: var(--brand-dark); }
        .hover\:text-brand-green:hover { color: var(--brand-green); }
        .focus\:ring-brand-green:focus { ring-color: var(--brand-green); }
    </style>
</head>
<body class="text-brand-dark">

    <!-- Header -->
    <header class="sticky top-0 bg-brand-light/90 backdrop-blur-lg shadow-sm z-50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold tracking-wider text-brand-green">OLIVES</a>
            <div class="hidden md:flex items-center space-x-8">
                <a href="shop.html" class="hover:text-brand-green transition-colors duration-300">חנות</a>
                <a href="#" class="hover:text-brand-green transition-colors duration-300">אודות</a>
                <a href="#" class="hover:text-brand-green transition-colors duration-300">יצירת קשר</a>
            </div>
            <div class="flex items-center">
                <a href="#" class="relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-brand-green" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                </a>
            </div>
        </nav>
    </header>

    <!-- Product Details -->
    <main class="py-20">
        <div class="container mx-auto px-6">
            <div class="md:flex md:space-x-12 rtl:space-x-reverse">
                <!-- Left: Image -->
                <div class="md:w-1/2">
                    <img src="https://images.unsplash.com/photo-1611652032952-a8c6778431d4?q=80&w=2070&auto=format&fit=crop" alt="שרשרת חריטה עדינה" class="w-full h-auto object-cover rounded-lg shadow-lg">
                </div>

                <!-- Right: Info -->
                <div class="md:w-1/2 mt-8 md:mt-0">
                    <h1 class="text-4xl font-bold">שרשרת חריטה עדינה</h1>
                    <p class="text-2xl text-brand-green my-4">₪299</p>
                    <div class="border-t pt-4">
                        <h2 class="text-lg font-semibold mb-2">תיאור</h2>
                        <p class="text-gray-600 leading-relaxed">
                            שרשרת עדינה ומודרנית, עשויה זהב אמיתי 14K או כסף טהור 925. מושלמת כמתנה אישית עם חריטה של שם, תאריך או מסר קצר. התכשיט מגיע באריזת מתנה יוקרתית.
                        </p>
                    </div>

                    <!-- Configuration -->
                    <div class="mt-8 space-y-6">
                        
                        <div>
                            <h3 class="text-lg font-semibold mb-3">גימור</h3>
                            <div class="flex space-x-4">
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="color" value="gold" class="h-5 w-5 border-gray-300 focus:ring-brand-green text-brand-green" checked>
                                    <span class="mr-2">זהב</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="color" value="silver" class="h-5 w-5 border-gray-300 focus:ring-brand-green text-brand-green">
                                    <span class="mr-2">כסף</span>
                                </label>
                            </div>
                        </div>
                        
                        <div>
                            <h3 class="text-lg font-semibold mb-3">אורך השרשרת</h3>
                            <select class="w-full p-3 border rounded-md bg-white shadow-sm focus:ring-2 focus:ring-brand-green focus:border-transparent">
                                <option>40 ס"מ</option>
                                <option>45 ס"מ</option>
                                <option>50 ס"מ</option>
                            </select>
                        </div>

                    </div>

                    <!-- Add to Cart -->
                    <div class="mt-8">
                        <button class="w-full bg-brand-green text-white py-4 text-lg font-semibold rounded-lg hover:bg-brand-dark transition-colors duration-300 shadow-lg">הוספה לסל</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-brand-dark text-white py-12 mt-20">
        <div class="container mx-auto px-6 text-center">
            <div class="flex justify-center space-x-6 mb-6">
                <a href="#" class="hover:text-gray-300">Facebook</a>
                <a href="#" class="hover:text-gray-300">Instagram</a>
                <a href="#" class="hover:text-gray-300">Pinterest</a>
            </div>
            <p>&copy; 2024 כל הזכויות שמורות ל-OLIVES JEWELRY</p>
        </div>
    </footer>

</body>
</html>
