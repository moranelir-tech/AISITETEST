<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קולקציה - Olives Jewelry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; }
    </style>
</head>
<body class="bg-[#fdfcfb] text-gray-900">
    <nav class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 py-4">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <div class="text-2xl font-light tracking-[0.2em] uppercase"><a href="index.html">Olives Jewelry</a></div>
            <div class="hidden md:flex space-x-12 space-x-reverse font-light text-sm">
                <a href="collection.html" class="hover:text-amber-600 transition">קולקציות</a>
                <a href="#" class="hover:text-amber-600 transition">חריטה אישית</a>
                <a href="#" class="hover:text-amber-600 transition">הסיפור שלנו</a>
                <a href="#" class="hover:text-amber-600 transition">צור קשר</a>
            </div>
            <a href="shop.html" class="border border-black px-8 py-2 text-xs uppercase tracking-widest hover:bg-black hover:text-white transition">לחנות</a>
        </div>
    </nav>

    <div id="product-card-container"></div>

    <footer class="bg-white border-t border-gray-100 py-20 px-6">
        <div class="max-w-7xl mx-auto text-center">
            <h3 class="text-xl font-light tracking-widest uppercase mb-10">Olives Jewelry</h3>
            <div class="flex justify-center space-x-8 space-x-reverse mb-12 text-sm text-gray-400 uppercase tracking-widest">
                <a href="#" class="hover:text-black">Instagram</a>
                <a href="#" class="hover:text-black">Facebook</a>
                <a href="#" class="hover:text-black">WhatsApp</a>
            </div>
            <p class="text-[10px] text-gray-300 uppercase tracking-[0.3em]">© 2026 Olives Jewelry | Designed by AI</p>
        </div>
    </footer>

    <script>
        fetch('product-card.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('product-card-container').innerHTML = data;
            });
    </script>

</body>
</html>
